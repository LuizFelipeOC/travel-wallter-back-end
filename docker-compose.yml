services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=oracle
      - DB_PORT=1521
      - DB_USER=admin
      - DB_PASSWORD=oracle123
    depends_on:
      oracle:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  oracle:
    image: gvenzl/oracle-xe:latest
    environment:
      - ORACLE_PASSWORD=oracle123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "sqlplus", "-h"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: on-failure

networks:
  app-network:
    driver: bridge

volumes:
  oracle_data:
